{% extends "base.html" %}
{% block title %}Error - Blood Bank{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Something went wrong</h1>
  <p class="sub">The application could not complete that request.</p>
</div>
<div class="card" style="border-left:4px solid var(--blood);">
  <p><b>Details:</b> {{ error }}</p>
  <p style="margin-bottom:0;">
    <a href="{{ url_for('dashboard') }}" class="btn secondary">Back to dashboard</a>
  </p>
</div>
{% endblock %}
